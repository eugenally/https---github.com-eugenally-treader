services:
  # MariaDB Database
  mariadb:
    image: mariadb:10.6
    container_name: treader-mariadb
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-treader_db}
      MYSQL_USER: ${MYSQL_USER:-boot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
      TZ: Asia/Seoul
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - treader-network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+09:00'

  # MailHog - 로컬 개발용 가상 SMTP 서버 및 웹 UI
  mailhog:
    image: mailhog/mailhog:latest
    container_name: treader-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP 포트
      - "${MAILHOG_UI_PORT:-8025}:8025"   # Web UI 포트
    networks:
      - treader-network

  # Treader Spring Boot 애플리케이션 (선택 실행: docker compose --profile app up)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: treader-app
    restart: unless-stopped
    profiles:
      - app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/treader_db?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-boot_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-1234}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MariaDB103Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_JWT_SECRET: ${APP_JWT_SECRET:treader-local-dev-secret-key-change-me-in-production-2026}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
    depends_on:
      mariadb:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - treader-network

volumes:
  mariadb_data:
    driver: local

networks:
  treader-network:
    driver: bridge
