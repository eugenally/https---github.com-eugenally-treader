services:
  # MariaDB Database
  #
  # 기본 기동에서 제외한다(profiles). 이 개발 환경은 Windows 네이티브 MariaDB 를 쓰는데,
  # 그쪽이 3306 의 IPv4 를 이미 점유하고 있어 이 컨테이너가 함께 뜨면 IPv6 에만 붙는다.
  # 그러면 HeidiSQL·앱(127.0.0.1)은 네이티브 서버를, 컨테이너는 제 데이터를 보게 되어
  # "테이블이 안 보인다"로 나타난다. 컨테이너 DB 가 필요할 때만 명시적으로 띄운다:
  #   docker compose --profile mariadb up -d
  # 이때는 네이티브 MariaDB 서비스를 먼저 멈추거나 MARIADB_PORT 를 3307 로 바꿀 것.
  mariadb:
    image: mariadb:10.6
    container_name: treader-mariadb
    restart: unless-stopped
    # app 프로파일은 이 컨테이너를 DB 로 쓰므로 그때도 함께 떠야 한다.
    profiles:
      - mariadb
      - app
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-treader_db}
      MYSQL_USER: ${MYSQL_USER:-treader_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
      TZ: Asia/Seoul
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - treader-network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+09:00'

  # MailHog - 로컬 개발용 가상 SMTP 서버 및 웹 UI
  mailhog:
    image: mailhog/mailhog:latest
    container_name: treader-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP 포트
      - "${MAILHOG_UI_PORT:-8025}:8025"   # Web UI 포트
    networks:
      - treader-network

  # Treader Spring Boot 애플리케이션 (선택 실행: docker compose --profile app up)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: treader-app
    restart: unless-stopped
    profiles:
      - app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/treader_db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-boot_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-1234}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MariaDB103Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_JWT_SECRET: treader-local-dev-secret-key-change-me-in-production-2026
      APP_FRONTEND_BASE_URL: http://localhost:5173
    depends_on:
      mariadb:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - treader-network

volumes:
  mariadb_data:
    driver: local

networks:
  treader-network:
    driver: bridge
