spring.application.name=treader
server.port=8080

# ====================================================================
# MariaDB Database 연결 설정 (Docker Compose: localhost:3306 / treader_db)
# ====================================================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/treader_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:treader_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# MariaDB 기본값인 REPEATABLE READ 에서는 스냅샷 이후 커밋된 행에 SELECT ... FOR UPDATE 를
# 걸면 오류 1020(Record has changed since last read)이 난다. 출하 확정의 비관적 락은
# Oracle(READ COMMITTED) 기준으로 짠 것이라 격리수준을 맞춰 준다.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# JPA / Hibernate 설정
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# Spring Boot 기본 전략은 @Table(name="MEMBER") 같은 명시적 이름까지 소문자로 바꾼다.
# Windows MariaDB 는 테이블명 대소문자를 구분하지 않아 넘어가지만, Linux 는 구분해서
# "Table 'treader_db.member' doesn't exist" 로 깨진다. DDL 이 대문자로 만드니 그대로 쓴다.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
# 스키마는 oracle_ddl.sql 이 원본이다. Hibernate 가 손대지 않게 none 으로 둔다.
spring.jpa.hibernate.ddl-auto=none

# ====================================================================
# 메일 SMTP 설정
# 기본값은 MailHog(localhost:1025). Gmail 등 실제 발송은 프로젝트 루트의 mail.env
# (git 제외, mail.env.example 참고) 또는 같은 이름의 환경변수로 덮어쓴다.
# 변수 이름은 treader.service 가 -D 로 넘기는 이름(SPRING_MAIL_*, APP_MAIL_FROM)과 맞춘다.
# ====================================================================
spring.config.import=optional:file:./mail.env[.properties]
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${APP_MAIL_FROM:no-reply@treader.local}

# ====================================================================
# 인증 (M1)
# ====================================================================
# HS256 서명키. 최소 32바이트여야 한다. 운영에서는 반드시 환경변수로 주입할 것.
app.jwt.secret=${APP_JWT_SECRET:treader-local-dev-secret-key-change-me-in-production-2026}
# 액세스 토큰 유효시간(분) — D3-02
app.jwt.validity-minutes=30
# 인증 메일의 링크가 가리킬 프론트엔드 주소
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# ====================================================================
# 게시판 첨부파일 (M2)
# ====================================================================
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
