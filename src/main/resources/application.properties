spring.application.name=treader
server.port=8080

# ====================================================================
# Oracle Database 연결 설정 (Docker Compose: localhost:1523 / XEPDB1)
# ====================================================================
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1523/XEPDB1}
spring.datasource.username=boot_user
spring.datasource.password=1234

# JPA / Hibernate 설정
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
# 스키마는 oracle_ddl.sql 이 원본이다. Hibernate 가 손대지 않게 none 으로 둔다.
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# ====================================================================
# MailHog SMTP 연결 설정 (Docker Compose: localhost:1025)
# ====================================================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
