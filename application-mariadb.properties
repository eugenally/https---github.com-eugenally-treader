# ====================================================================
# TreaderAPP - MariaDB Configuration
# Oracle에서 MariaDB로 변환된 설정
# ====================================================================

# 데이터소스 설정
spring.datasource.url=jdbc:mariadb://localhost:3306/treader_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 데이터소스 연결 풀 (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate 설정
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 트랜잭션 격리 수준
spring.jpa.properties.hibernate.connection.isolation=READ_COMMITTED

# 시간대 설정
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.context-parameters.org.springframework.web.servlet.i18n.SessionLocaleResolver.LOCALE=ko_KR

# 데이터베이스 풀 모니터링 (선택사항)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# 로깅 설정
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# MariaDB 특화 설정
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
